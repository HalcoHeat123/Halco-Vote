<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Halco Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f7f8fa;min-height:100vh}
input,textarea,button{font-family:inherit}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

@keyframes livePosterIn{
  0%{opacity:0;transform:translateY(-8px) scale(1.015);filter:brightness(.8)}
  100%{opacity:1;transform:none;filter:none}
}
@keyframes liveButtonGlow{
  0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.96),0 0 20px rgba(255,115,0,.55),0 10px 28px rgba(0,0,0,.38)}
  50%{box-shadow:0 0 0 3px #fff,0 0 38px rgba(255,115,0,.88),0 12px 34px rgba(0,0,0,.46)}
}
@keyframes liveButtonShine{
  0%{left:-25%;opacity:0}
  12%{opacity:.65}
  42%{left:108%;opacity:0}
  100%{left:108%;opacity:0}
}
.halco-launch-poster{
  display:block;
  width:100%;
  height:auto;
  animation:livePosterIn .75s ease-out both;
}
.halco-live-cta-wrap{
  width:100%;
  background:#031d3d;
  padding:12px 7% 24px;
  display:flex;
  justify-content:center;
}
.halco-live-cta{
  position:relative;
  width:min(78%,1180px);
  min-height:92px;
  padding:18px 48px;
  border:3px solid #fff;
  border-radius:999px;
  overflow:hidden;
  background:
    linear-gradient(180deg,#ff9820 0%,#ff7c00 50%,#f05f00 100%);
  color:#fff;
  font-family:'Inter',system-ui,sans-serif;
  font-weight:900;
  font-style:italic;
  font-size:clamp(28px,4vw,58px);
  letter-spacing:.015em;
  text-shadow:0 3px 3px rgba(0,0,0,.32);
  cursor:pointer;
  animation:liveButtonGlow 3s ease-in-out infinite;
  transition:transform .18s ease,filter .18s ease;
}
.halco-live-cta::before{
  content:"";
  position:absolute;
  top:-40%;
  left:-25%;
  width:16%;
  height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-18deg);
}
.halco-live-cta::after{
  content:"★";
  position:absolute;
  left:7%;
  top:50%;
  transform:translateY(-50%);
  color:#092846;
  font-size:.78em;
  text-shadow:none;
}
.halco-live-cta .right-star{
  position:absolute;
  right:7%;
  top:50%;
  transform:translateY(-50%);
  color:#092846;
  font-size:.78em;
  text-shadow:none;
}
@media (hover:hover) and (pointer:fine){
  .halco-live-cta:hover{
    transform:translateY(-3px) scale(1.01);
    filter:brightness(1.07);
  }
  .halco-live-cta:hover::before{
    animation:liveButtonShine 1.15s ease-out;
  }
}
.halco-live-cta:active{
  transform:translateY(1px) scale(.993);
  filter:brightness(.95);
}
.halco-live-cta:focus-visible{
  outline:4px solid #fff;
  outline-offset:5px;
}
@media(max-width:700px){
  .halco-live-cta-wrap{padding:10px 5% 18px}
  .halco-live-cta{
    width:92%;
    min-height:60px;
    padding:12px 38px;
    font-size:clamp(20px,7vw,32px);
    border-radius:999px;
  }
  .halco-live-cta::after{left:5%}
  .halco-live-cta .right-star{right:5%}
}
@media(prefers-reduced-motion:reduce){
  .halco-launch-poster,.halco-live-cta{animation:none!important}
}

</style>
</head>

// Default vote config — change these to reuse for any vote
const getCurrentMonthYear = () => new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });

const DEFAULT_CONFIG = {
  title: "Employee of the Month",
  currentMonth: getCurrentMonthYear(),
  description: "Nominate a Halco team member who went above and beyond this month. All votes are anonymous and reviewed by the committee.",
  requireReason: true,
  votingOpen: true,
};

function HalcoVote() {
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [nominee, setNominee] = useState("");
  const [reason, setReason] = useState("");
  const [loading, setLoading] = useState(false);
  const [entered, setEntered] = useState(false);
  const [confetti, setConfetti] = useState([]);
  const [tab, setTab] = useState("vote");
  const [adminKey, setAdminKey] = useState("");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [configSaveStatus, setConfigSaveStatus] = useState("");

  const ADMIN_PIN = "halco2026";
  const API_URL = "https://script.google.com/macros/s/AKfycbwekZnh9uo8rRaxF0Iyg1IqZNdA8ClE9Zfc-E0FP5LZEJK5N_mkV7XBwB_ZPkeZ77om/exec";

  useEffect(() => {
    const loadConfig = async () => {
      setLoading(true);
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getConfig" }),
        });
        const data = await res.json();
        if (data.success && data.config) {
          setConfig(prev => ({
            ...prev,
            ...data.config,
            currentMonth: data.config.currentMonth || prev.currentMonth,
            votingOpen: data.config.votingOpen !== false,
            requireReason: data.config.requireReason !== false,
          }));
        }
      } catch (e) {
        console.warn("Could not load saved vote configuration; using defaults.", e);
      } finally {
        setLoading(false);
      }
    };
    loadConfig();
  }, []);


  const launchConfetti = () => {
    const colors = [HALCO_BLUE, HALCO_ORANGE, "#FFD700", "#ffffff", "#003F7F", "#FF9F40"];
    const pieces = Array.from({ length: 60 }, (_, i) => ({
      id: i,
      x: Math.random() * 100,
      delay: Math.random() * 0.6,
      duration: 2 + Math.random() * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 6 + Math.random() * 8,
      rotation: Math.random() * 360,
      drift: -30 + Math.random() * 60,
    }));
    setConfetti(pieces);
    setTimeout(() => setConfetti([]), 4500);
  };

  const handleSubmit = async () => {
    if (config.votingOpen === false) { setError("Voting is currently closed."); return; }
    if (!nominee.trim()) { setError("Enter a nominee name."); return; }
    if (config.requireReason && !reason.trim()) { setError("Include a reason for your nomination."); return; }

    setError("");
    setSubmitting(true);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "vote",
          nominee: nominee.trim(),
          reason: reason.trim(),
        }),
      });

      const data = await res.json();

      if (data.success) {
        setSubmitted(true);
        setNominee("");
        setReason("");
        launchConfetti();
        playSubmitChime();
      } else {
        setError(data.error || "Something went wrong. Try again.");
      }
    } catch (e) {
      setError("Couldn't connect to the server. Check your internet and try again.");
    }

    setSubmitting(false);
  };

  const handleReset = async () => {
    setSubmitted(false);
    setNominee("");
    setReason("");
    setError("");
  };

  const handleConfigSave = async () => {
    setConfigSaveStatus("Saving...");
    setError("");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "saveConfig",
          config: {
            title: config.title,
            subtitle: config.currentMonth,
            currentMonth: config.currentMonth,
            description: config.description,
            requireReason: config.requireReason,
            votingOpen: config.votingOpen,
          },
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Could not save configuration.");
      if (data.config) {
        setConfig(prev => ({ ...prev, ...data.config, currentMonth: data.config.currentMonth || prev.currentMonth }));
      }
      setConfigSaveStatus("Saved ✓");
      setTimeout(() => setConfigSaveStatus(""), 2500);
    } catch (e) {
      setConfigSaveStatus("");
      setError(e.message || "Could not save configuration.");
    }
  };

  const playWelcomeChime = async () => {
    await Tone.start();
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 1.0 },
      volume: -10,
    }).toDestination();
    const bright = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "sine" },
      envelope: { attack: 0.01, decay: 0.15, sustain: 0.1, release: 0.8 },
      volume: -18,
    }).toDestination();
    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.35 }).toDestination();
    synth.connect(reverb);
    bright.connect(reverb);
    const now = Tone.now();
    // Quick rising fanfare
    synth.triggerAttackRelease("C4", "16n", now);
    synth.triggerAttackRelease("E4", "16n", now + 0.08);
    synth.triggerAttackRelease("G4", "16n", now + 0.16);
    // Big celebratory chord
    synth.triggerAttackRelease(["C5", "E5", "G5"], "4n", now + 0.3);
    bright.triggerAttackRelease(["C6", "G5"], "4n", now + 0.3);
    // Sparkle finish
    bright.triggerAttackRelease("E6", "8n", now + 0.55);
    bright.triggerAttackRelease("G6", "16n", now + 0.7);
    bright.triggerAttackRelease("C7", "8n", now + 0.85);
    setTimeout(() => { synth.dispose(); bright.dispose(); reverb.dispose(); }, 4000);
  };

  const handleEnter = async () => {
    playWelcomeChime();
    setEntered(true);
  };

  const playSubmitChime = async () => {
    await Tone.start();
    const bell = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "sine" },
      envelope: { attack: 0.005, decay: 0.25, sustain: 0.05, release: 0.6 },
      volume: -8,
    }).toDestination();
    const shimmer = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 1.2 },
      volume: -16,
    }).toDestination();
    const reverb = new Tone.Reverb({ decay: 1.8, wet: 0.3 }).toDestination();
    bell.connect(reverb);
    shimmer.connect(reverb);
    const now = Tone.now();
    // Quick double tap
    bell.triggerAttackRelease("G5", "16n", now);
    bell.triggerAttackRelease("G5", "16n", now + 0.1);
    // Victory resolve
    bell.triggerAttackRelease(["C6", "E6"], "4n", now + 0.22);
    // Shimmer trail
    shimmer.triggerAttackRelease("G6", "8n", now + 0.35);
    shimmer.triggerAttackRelease("C7", "8n", now + 0.5);
    setTimeout(() => { bell.dispose(); shimmer.dispose(); reverb.dispose(); }, 3000);
  };

  if (loading) return (
    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", height: "100vh", fontFamily: "'Inter', system-ui, sans-serif" }}>
      <p style={{ color: HALCO_BLUE, fontSize: 18 }}>Loading...</p>
    </div>
  );

  if (!entered) return (
    <div style={{
      fontFamily:"'Inter',system-ui,sans-serif",
      minHeight:"100vh",
      background:"#031d3d",
      display:"flex",
      flexDirection:"column",
      alignItems:"center",
      justifyContent:"center",
      overflow:"hidden"
    }}>
      <div style={{width:"100%",maxWidth:1536}}>
        <img
          className="halco-launch-poster"
          src={HERO_IMAGE}
          alt="The Halco Way — Halco Hero Employee of the Month"
        />
        <div className="halco-live-cta-wrap">
          <button
            className="halco-live-cta"
            onClick={handleEnter}
            aria-label="Enter voting"
          >
            ENTER VOTING
            <span className="right-star" aria-hidden="true">★</span>
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ fontFamily: "'Inter', system-ui, sans-serif", minHeight: "100vh", background: "#f7f8fa", position: "relative", overflow: "hidden" }}>
      {/* Confetti */}
      {confetti.length > 0 && (
        <>
          <style>{`
            @keyframes confettiFall {
              0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
              80% { opacity: 1; }
              100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
            }
          `}</style>
          {confetti.map(p => (
            <div key={p.id} style={{
              position: "fixed", top: 0, left: `${p.x}%`, width: p.size, height: p.size * 0.6,
              background: p.color, borderRadius: 2, zIndex: 9999, pointerEvents: "none",
              animation: `confettiFall ${p.duration}s ease-in ${p.delay}s forwards`,
              transform: `rotate(${p.rotation}deg) translateX(${p.drift}px)`,
            }} />
          ))}
        </>
      )}
      {/* Header */}
      <div style={{
        background: `linear-gradient(135deg, ${HALCO_BLUE} 0%, #001a33 72%, #6b3600 100%)`,
        padding: "40px 24px 36px", color: "white", position: "relative"
      }}>
        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(ellipse at 80% 20%, rgba(255,127,0,0.15) 0%, transparent 60%)" }} />
        <div style={{ maxWidth: 600, margin: "0 auto", position: "relative" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <div style={{ width: 36, height: 36, borderRadius: "50%", background: "rgba(255,255,255,0.9)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <img src={HALCO_LOGO} alt="Halco" style={{ width: 26, height: 26, objectFit: "contain" }} />
            </div>
            <span style={{ fontWeight: 700, fontSize: 20, letterSpacing: "-0.02em", textShadow: "0 1px 4px rgba(0,0,0,0.3)" }}>The Halco Way</span>
          </div>
          <h1 style={{ margin: "16px 0 4px", fontSize: 32, fontWeight: 800, letterSpacing: "-0.03em", textShadow: "0 2px 8px rgba(0,0,0,0.3)" }}>{config.title}</h1>
          <p style={{ margin: 0, opacity: 0.9, fontSize: 16, fontWeight: 500, textShadow: "0 1px 4px rgba(0,0,0,0.2)" }}>{config.currentMonth}</p>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ maxWidth: 600, margin: "0 auto", display: "flex", borderBottom: "2px solid #e5e7eb", background: "white" }}>
        {["vote", "settings"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            flex: 1, padding: "12px 0", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 14,
            background: "transparent", color: tab === t ? HALCO_BLUE : "#9ca3af",
            borderBottom: tab === t ? `3px solid ${HALCO_BLUE}` : "3px solid transparent",
            textTransform: "capitalize", transition: "all 0.15s"
          }}>{t === "settings" ? "Admin" : t}</button>
        ))}
      </div>

      <div style={{ maxWidth: 600, margin: "0 auto", padding: "20px 16px" }}>

        {/* VOTE TAB */}
        {tab === "vote" && (
          <>
            <p style={{ color: "#4b5563", fontSize: 15, lineHeight: 1.5, margin: "0 0 16px" }}>{config.description}</p>

            {config.votingOpen === false && (
              <div style={{ padding: "12px 14px", borderRadius: 8, background: "#fff7ed", border: "1px solid #fed7aa", color: "#9a3412", fontWeight: 600, fontSize: 14, marginBottom: 16 }}>
                Voting is currently closed. Check back when the next voting period opens.
              </div>
            )}

            {submitted ? (
              <div style={{ textAlign: "center", padding: "48px 20px", background: "white", borderRadius: 12, border: "1px solid #e5e7eb", position: "relative", overflow: "hidden" }}>
                <div style={{ width: 64, height: 64, borderRadius: "50%", background: `${HALCO_ORANGE}18`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", fontSize: 32 }}>🎉</div>
                <h2 style={{ margin: "0 0 6px", fontSize: 22, fontWeight: 700, color: "#111" }}>Nomination submitted!</h2>
                <p style={{ color: "#6b7280", fontSize: 15, lineHeight: 1.5, maxWidth: 380, margin: "0 auto 12px" }}>
                  Your anonymous nomination has been recorded for {config.currentMonth || config.subtitle}.
                </p>
                <p style={{ color: "#9ca3af", fontSize: 13, marginTop: 12 }}>
                  The committee will review nominations at the end of the voting period.
                </p>
                <button onClick={handleReset} style={{
                  marginTop: 18, padding: "10px 24px", border: "none", borderRadius: 8,
                  background: HALCO_BLUE, color: "white", fontWeight: 700, fontSize: 14, cursor: "pointer"
                }}>Submit Another Nomination</button>
              </div>
            ) : (
              <div style={{ background: "white", borderRadius: 12, border: "1px solid #e5e7eb", padding: 24 }}>
                <label style={{ display: "block", fontWeight: 600, fontSize: 14, color: "#374151", marginBottom: 6 }}>Nominee</label>
                <input
                  value={nominee}
                  onChange={e => setNominee(e.target.value)}
                  placeholder="Full name of the person you're nominating"
                  style={{ width: "100%", padding: "10px 14px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 15, boxSizing: "border-box", outline: "none" }}
                  onFocus={e => e.target.style.borderColor = HALCO_BLUE}
                  onBlur={e => e.target.style.borderColor = "#d1d5db"}
                />

                {config.requireReason && (
                  <>
                    <label style={{ display: "block", fontWeight: 600, fontSize: 14, color: "#374151", marginBottom: 6, marginTop: 16 }}>Why this person?</label>
                    <textarea
                      value={reason}
                      onChange={e => setReason(e.target.value)}
                      placeholder="What did they do that stood out?"
                      rows={3}
                      style={{ width: "100%", padding: "10px 14px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 15, boxSizing: "border-box", resize: "vertical", outline: "none", fontFamily: "inherit" }}
                      onFocus={e => e.target.style.borderColor = HALCO_BLUE}
                      onBlur={e => e.target.style.borderColor = "#d1d5db"}
                    />
                  </>
                )}

                {error && <p style={{ color: "#dc2626", fontSize: 13, margin: "8px 0 0" }}>{error}</p>}

                <button onClick={handleSubmit} disabled={submitting || config.votingOpen === false} style={{
                  width: "100%", padding: "12px 0", marginTop: 20, border: "none", borderRadius: 8,
                  background: (submitting || config.votingOpen === false) ? "#ccc" : HALCO_ORANGE,
                  color: "white", fontWeight: 700, fontSize: 16,
                  cursor: (submitting || config.votingOpen === false) ? "default" : "pointer",
                  transition: "opacity 0.15s"
                }}
                  onMouseEnter={e => { if (!submitting && config.votingOpen !== false) e.target.style.opacity = 0.9; }}
                  onMouseLeave={e => e.target.style.opacity = 1}
                >{submitting ? "Submitting..." : "Submit Nomination"}</button>
              </div>
            )}

            <p style={{ textAlign: "center", color: "#9ca3af", fontSize: 12, marginTop: 16 }}>
              No voter name is collected. Nominations are anonymous and reviewed by the committee.
            </p>
          </>
        )}

        {/* ADMIN TAB */}
        {tab === "settings" && (
          <>
            {!adminUnlocked ? (
              <div style={{ background: "white", borderRadius: 12, border: "1px solid #e5e7eb", padding: 24, textAlign: "center" }}>
                <h2 style={{ margin: "0 0 8px", fontSize: 18, fontWeight: 700, color: "#111" }}>Committee Access</h2>
                <p style={{ color: "#6b7280", fontSize: 14, marginBottom: 16 }}>Enter the admin PIN to manage this vote.</p>
                <input
                  type="password"
                  value={adminKey}
                  onChange={e => setAdminKey(e.target.value)}
                  placeholder="Admin PIN"
                  style={{ padding: "10px 14px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 15, textAlign: "center", width: 180, outline: "none" }}
                  onKeyDown={e => { if (e.key === "Enter" && adminKey === ADMIN_PIN) setAdminUnlocked(true); }}
                />
                <br />
                <button onClick={() => { if (adminKey === ADMIN_PIN) setAdminUnlocked(true); else setError("Wrong PIN"); }}
                  style={{ marginTop: 12, padding: "10px 32px", border: "none", borderRadius: 8, background: HALCO_BLUE, color: "white", fontWeight: 600, fontSize: 14, cursor: "pointer" }}
                >Unlock</button>
                {error && tab === "settings" && <p style={{ color: "#dc2626", fontSize: 13, marginTop: 8 }}>{error}</p>}
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                <div style={{ background: "white", borderRadius: 12, border: "1px solid #e5e7eb", padding: 24 }}>
                  <h3 style={{ margin: "0 0 16px", fontSize: 16, fontWeight: 700, color: "#111" }}>Configure Vote</h3>

                  <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "#374151", marginBottom: 4 }}>Vote Title</label>
                  <input value={config.title} onChange={e => setConfig({ ...config, title: e.target.value })}
                    style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 14, boxSizing: "border-box", marginBottom: 12 }} />

                  <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "#374151", marginBottom: 4 }}>Voting Month</label>
                  <input value={config.currentMonth} placeholder="August 2026" onChange={e => setConfig({ ...config, currentMonth: e.target.value })}
                    style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 14, boxSizing: "border-box", marginBottom: 12 }} />

                  <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "#374151", marginBottom: 4 }}>Description</label>
                  <textarea value={config.description} onChange={e => setConfig({ ...config, description: e.target.value })}
                    rows={2} style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: "1px solid #d1d5db", fontSize: 14, boxSizing: "border-box", resize: "vertical", fontFamily: "inherit", marginBottom: 12 }} />

                  <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: "#374151", cursor: "pointer" }}>
                    <input type="checkbox" checked={config.requireReason} onChange={e => setConfig({ ...config, requireReason: e.target.checked })} />
                    <span>Require a written reason with each nomination</span>
                  </label>

                  <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: "#374151", cursor: "pointer", marginTop: 12 }}>
                    <input type="checkbox" checked={config.votingOpen !== false} onChange={e => setConfig({ ...config, votingOpen: e.target.checked })} />
                    <span>Voting is open</span>
                  </label>

                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 18 }}>
                    <button onClick={handleConfigSave}
                      style={{ padding: "10px 20px", border: "none", borderRadius: 8, background: HALCO_ORANGE, color: "white", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                      Save Configuration
                    </button>
                    {configSaveStatus && <span style={{ fontSize: 13, fontWeight: 600, color: configSaveStatus.startsWith("Saved") ? "#15803d" : "#6b7280" }}>{configSaveStatus}</span>}
                  </div>
                </div>

                <div style={{ background: "white", borderRadius: 12, border: "1px solid #e5e7eb", padding: 24 }}>
                  <h3 style={{ margin: "0 0 8px", fontSize: 16, fontWeight: 700, color: "#111" }}>View Results</h3>
                  <p style={{ color: "#6b7280", fontSize: 13, marginBottom: 12 }}>All nominations and raffle tickets are tracked in the Google Sheet. Open it to review with the committee.</p>
                  <a href="https://docs.google.com/spreadsheets" target="_blank" rel="noopener noreferrer"
                    style={{ display: "inline-block", padding: "10px 20px", border: "none", borderRadius: 8, background: HALCO_BLUE, color: "white", fontWeight: 600, fontSize: 14, textDecoration: "none", cursor: "pointer" }}
                  >Open Google Sheets</a>
                </div>

                <div style={{ background: "#fef2f2", borderRadius: 12, border: "1px solid #fecaca", padding: 24 }}>
                  <h3 style={{ margin: "0 0 8px", fontSize: 16, fontWeight: 700, color: "#991b1b" }}>Reset Local View</h3>
                  <p style={{ color: "#7f1d1d", fontSize: 13, marginBottom: 12 }}>Reset your local session to test voting again. This does not delete any data from the Google Sheet.</p>
                  <button onClick={handleReset}
                    style={{ padding: "10px 20px", border: "none", borderRadius: 8, background: "#dc2626", color: "white", fontWeight: 600, fontSize: 14, cursor: "pointer" }}
                  >Reset Local Session</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {/* Footer */}
      <div style={{ textAlign: "center", padding: "24px 16px", color: "#9ca3af", fontSize: 12 }}>
        The Halco Way — Recognizing Our Best
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(HalcoVote));
</script>
</body>
</html>
